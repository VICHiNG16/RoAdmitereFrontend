  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f6f8fb;
      color: #132132;
    }
    body {
      margin: 0;
      padding: 20px;
      background: #f6f8fb;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      align-items: end;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(10, 25, 47, 0.08);
      padding: 12px;
    }
    label {
      display: grid;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #3d4f66;
    }
    select, input[type="range"] {
      min-width: 180px;
    }
    .meta {
      font-size: 13px;
      color: #415a77;
    }
    .canvas {
      position: relative;
      border-radius: 12px;
      overflow: auto;
      max-height: calc(100vh - 220px);
      background: #0b1420;
      box-shadow: 0 10px 32px rgba(15, 23, 42, 0.22);
      padding: 12px;
    }
    .stack {
      position: relative;
      display: inline-block;
      line-height: 0;
    }
    .stack img {
      display: block;
      max-width: min(100%, 460px);
      height: auto;
      border-radius: 10px;
    }
    #reference {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .compare {
      display: grid;
      grid-template-columns: repeat(3, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .compare figure {
      margin: 0;
      background: #fff;
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 4px 14px rgba(10, 25, 47, 0.08);
    }
    .compare figcaption {
      font-size: 12px;
      color: #3d4f66;
      margin-top: 8px;
    }
    .compare img {
      max-width: 100%;
      border-radius: 6px;
    }
    .empty {
      padding: 24px;
      background: #fff;
      border-radius: 12px;
      border: 1px dashed #c5d2e0;
      color: #3d4f66;
      font-size: 14px;
    }
  </style>
</head>

ole": "favorites-empty", "referencePath": "C:/Users/CALU/repos/antigravity/RoAdmitereFrontend/stitch_roadmitere/explorează_universități_13/screen.png", "capturePath": "captures/android/13.png", "diffPath": "diffs/android/13_diff.png", "diffPercent": 0.0, "thresholdPercent": 3.0}];

    if (!entries.length) {

      const platforms = [...new Set(entries.map((entry) => entry.platform))];
      let selectedPlatform = platforms.includes("ios") ? "ios" : platforms[0];

      const controls = document.createElement("div");

      const opacitySlider = document.getElementById("opacitySlider");
      const meta = document.getElementById("meta");
      const capture = document.getElementById("capture");
      const reference = document.getElementById("reference");
      const capturePreview = document.getElementById("capturePreview");
      const referencePreview = document.getElementById("referencePreview");
      const diffPreview = document.getElementById("diffPreview");

      platformSelect.innerHTML = platforms.map((platform) => `<option value="${platform}">${platform}</option>`).join("");
      platformSelect.value = selectedPlatform;

      const updateScreenOptions = () => {
        const platformEntries = entries.filter((entry) => entry.platform === selectedPlatform);
        screenSelect.innerHTML = platformEntries
          .map((entry) => `<option value="${entry.screenId}">${String(entry.screenId).padStart(2, "0")} - ${entry.role}</option>`)
          .join("");
        if (platformEntries.length > 0) {
          screenSelect.value = String(platformEntries[0].screenId);
        }
      };

      const render = () => {
        const platformEntries = entries.filter((entry) => entry.platform === selectedPlatform);
        const selected = platformEntries.find((entry) => String(entry.screenId) === String(screenSelect.value)) || platformEntries[0];
        if (!selected) {
          return;
        }
        const opacity = Number(opacitySlider.value) / 100;
        capture.src = selected.capturePath;
        reference.src = selected.referencePath;
        capturePreview.src = selected.capturePath;
        referencePreview.src = selected.referencePath;
        diffPreview.src = selected.diffPath;

      render();

      platformSelect.addEventListener("change", () => {
        selectedPlatform = platformSelect.value;
        updateScreenOptions();
        render();
      });
