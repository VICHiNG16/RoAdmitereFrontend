<!DOCTYPE html>
<html class="light" lang="ro"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Filtrează programe</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Pacifico&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {

            theme: {
            extend: {

                    "terracotta": "#E07A5F",

                    "olive-dark": "#6B9680",
                    "sand": "#F4F1DE",
                    "deep-blue": "#3D405B",

                    "display": ["Plus Jakarta Sans", "sans-serif"],

                },
                borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem", "full": "9999px"},

            },

            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            min-height: max(884px, 100dvh);
        }

<style>
    body {
      min-height: max(884px, 100dvh);

<style>

<body class="bg-sand font-display text-deep-blue min-h-screen antialiased selection:bg-terracotta/20">
<div class="mx-auto max-w-md min-h-screen flex flex-col relative overflow-hidden bg-sand">
<div class="h-12 w-full flex items-end justify-between px-6 pb-2 z-20 text-deep-blue">
<span class="text-xs font-bold">9:41</span>
<div class="flex gap-1.5 items-center">
<span class="material-icons text-[16px]">signal_cellular_alt</span>
<span class="material-icons text-[16px]">wifi</span>
<span class="material-icons text-[16px]">battery_full</span>
</div>
</div>
<header class="px-5 pt-4 pb-4 z-10 sticky top-0 bg-sand/95 backdrop-blur-sm flex items-center gap-4">
<button class="h-10 w-10 rounded-full bg-white border border-stone-100 flex items-center justify-center hover:bg-stone-50 transition-colors shadow-sm active:scale-95 text-deep-blue">
<span class="material-icons text-deep-blue/80">arrow_back</span>
</button>
<h1 class="text-2xl font-bold text-deep-blue">Filtrează programe</h1>
</header>
<main class="flex-1 px-5 pb-32 overflow-y-auto hide-scrollbar space-y-6">
<section class="bg-surface-card rounded-3xl p-6 shadow-card border border-stone-100">
<div class="flex items-center gap-2 mb-6">
<span class="w-8 h-8 rounded-full bg-terracotta/10 flex items-center justify-center text-terracotta">
<span class="material-icons text-lg">language</span>
</span>
<h2 class="text-lg font-bold text-deep-blue">Limbă</h2>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="group relative flex items-center justify-center py-4 rounded-2xl bg-terracotta text-white shadow-md transition-all active:scale-95">
<span class="text-base font-bold">Română</span>
<span class="absolute top-2 right-2 bg-white/20 text-white px-1.5 py-0.5 rounded-lg text-[10px] font-medium min-w-[24px] text-center">124</span>
</button>
<button class="group relative flex items-center justify-center py-4 rounded-2xl bg-sand/50 hover:bg-terracotta/10 text-deep-blue border border-transparent hover:border-terracotta/20 transition-all active:scale-95">
<span class="text-base font-bold opacity-70 group-hover:opacity-100">Engleză</span>
<span class="absolute top-2 right-2 bg-white/60 text-deep-blue/50 px-1.5 py-0.5 rounded-lg text-[10px] font-medium min-w-[24px] text-center">45</span>
</button>
<button class="group relative flex items-center justify-center py-4 rounded-2xl bg-sand/50 hover:bg-terracotta/10 text-deep-blue border border-transparent hover:border-terracotta/20 transition-all active:scale-95">

<span class="absolute top-2 right-2 bg-white/60 text-deep-blue/50 px-1.5 py-0.5 rounded-lg text-[10px] font-medium min-w-[24px] text-center">12</span>
</button>
<button class="group relative flex items-center justify-center py-4 rounded-2xl bg-sand/50 hover:bg-terracotta/10 text-deep-blue border border-transparent hover:border-terracotta/20 transition-all active:scale-95">
<span class="text-base font-bold opacity-70 group-hover:opacity-100">Germană</span>
<span class="absolute top-2 right-2 bg-white/60 text-deep-blue/50 px-1.5 py-0.5 rounded-lg text-[10px] font-medium min-w-[24px] text-center">8</span>
</button>
</div>
</section>
<section class="bg-surface-card rounded-3xl p-5 shadow-card border border-stone-100">
<div class="flex items-center gap-2 mb-4">
<span class="w-8 h-8 rounded-full bg-deep-blue/10 flex items-center justify-center text-deep-blue">
<span class="material-icons text-lg">auto_stories</span>
</span>
<h2 class="text-lg font-bold text-deep-blue">Nivel</h2>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="relative group h-32 rounded-[24px] bg-deep-blue/10 border-2 border-deep-blue flex flex-col items-center justify-center text-center shadow-sm overflow-hidden">
<div class="absolute top-3 right-3 w-6 h-6 rounded-full bg-deep-blue flex items-center justify-center z-10">
<span class="material-icons text-[14px] text-white">check</span>
</div>
<div class="absolute w-24 h-24 bg-deep-blue/10 rounded-full blur-2xl -top-4 -left-4"></div>
<span class="w-12 h-12 rounded-full bg-white shadow-sm flex items-center justify-center text-deep-blue mb-3 z-10">
<span class="material-icons text-2xl">workspace_premium</span>
</span>
<span class="block font-bold text-deep-blue text-sm z-10">Licență</span>
</button>
<button class="relative group h-32 rounded-[24px] bg-sand/30 border-2 border-transparent hover:border-deep-blue/30 hover:bg-sand/60 transition-all flex flex-col items-center justify-center text-center overflow-hidden">
<div class="absolute top-3 right-3 w-6 h-6 rounded-full border-2 border-deep-blue/10 group-hover:border-deep-blue transition-colors"></div>

<span class="w-12 h-12 rounded-full bg-white shadow-sm flex items-center justify-center text-deep-blue/70 group-hover:text-deep-blue mb-3 z-10 transition-colors">
<span class="material-icons text-2xl">psychology</span>
</span>
<span class="block font-bold text-deep-blue/70 group-hover:text-deep-blue text-sm z-10 transition-colors">Master</span>
</button>
</div>
</section>

<span class="w-8 h-8 rounded-full bg-olive/10 flex items-center justify-center text-olive">
<span class="material-icons text-lg">schedule</span>
</span>

<button class="flex-1 py-3 px-4 rounded-xl bg-olive text-white shadow-sm font-bold text-xs sm:text-sm transition-all flex items-center justify-center gap-2 relative z-10">
<span class="material-icons text-sm sm:text-base">school</span>
            Cu frecvență (IF)
        </button>
<button class="flex-1 py-3 px-4 rounded-xl text-deep-blue/70 hover:text-deep-blue font-bold text-xs sm:text-sm transition-all flex items-center justify-center gap-2 relative z-10 hover:bg-white/50">
<span class="material-icons text-sm sm:text-base">computer</span>
            La distanță (ID)
        </button>
</div>
</section>
<section class="bg-surface-card rounded-3xl p-5 shadow-card border border-stone-100">
<div class="flex items-center gap-2 mb-4">
<span class="w-8 h-8 rounded-full bg-terracotta/10 flex items-center justify-center text-terracotta">
<span class="material-icons text-lg">timelapse</span>
</span>
<h2 class="text-lg font-bold text-deep-blue">Durată studii</h2>
</div>
<div class="flex flex-wrap gap-3">
<button class="group flex items-center gap-2 pl-3 pr-4 py-2.5 rounded-full bg-terracotta text-white shadow-md transition-all active:scale-95">
<div class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center">
<span class="material-icons text-[12px]">check</span>
</div>
<span class="text-sm font-bold">3 Ani</span>
</button>
<button class="group flex items-center gap-2 px-4 py-2.5 rounded-full bg-sand/50 hover:bg-terracotta/10 text-deep-blue border border-transparent hover:border-terracotta/20 transition-all active:scale-95">
<span class="text-sm font-bold opacity-70 group-hover:opacity-100">4 Ani</span>
</button>
<button class="group flex items-center gap-2 px-4 py-2.5 rounded-full bg-sand/50 hover:bg-terracotta/10 text-deep-blue border border-transparent hover:border-terracotta/20 transition-all active:scale-95">
<span class="text-sm font-bold opacity-70 group-hover:opacity-100">6 Ani</span>
</button>
</div>
</section>

<button class="text-sm font-bold text-deep-blue/50 hover:text-deep-blue transition-colors px-4 py-2">
                    Resetează
                </button>
<button class="flex-1 bg-terracotta text-white h-14 rounded-2xl font-bold text-lg shadow-sticker active:scale-95 transition-transform flex items-center justify-center gap-2">

</button>
</div>
<div class="w-32 h-1 bg-deep-blue/10 rounded-full mx-auto mt-6"></div>
