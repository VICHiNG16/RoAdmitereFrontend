<!DOCTYPE html>
<html class="light" lang="ro"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Favorite - Colecție Goală</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Pacifico&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
            extend: {
                colors: {
                    "terracotta": "#E07A5F",
                    "terracotta-dark": "#C86045",
                    "cream": "#FDFCF5",
                    "olive": "#81B29A",
                    "olive-dark": "#6B9680",
                    "sand": "#F4F1DE",
                    "muted-sand": "#EBE7D6", 
                    "deep-blue": "#3D405B",
                    "surface-card": "#FFFFFF",
                    "tab-inactive": "#F0EFE9", 
                    "tab-inactive-darker": "#E6E4DC"
                },
                fontFamily: {
                    "display": ["Plus Jakarta Sans", "sans-serif"],
                    "hand": ["Pacifico", "cursive"],
                },
                borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem", "full": "9999px"},
                boxShadow: {
                    "soft": "0 10px 40px -10px rgba(0,0,0,0.05)",
                    "card": "0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02)",
                    "sticker": "2px 4px 8px rgba(224, 122, 95, 0.3)",
                    "tab": "0 -2px 6px rgba(0,0,0,0.03)"
                }
            },
            },
        }
    </script>
<style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .brush-stroke {
            position: relative;
        }
        .brush-stroke::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 6px;
            background-color: #E07A5F;
            border-radius: 4px;
            z-index: -1;
            transform: skew(-10deg) rotate(-2deg);
            opacity: 0.8;
        }
        .heart-bounce {
             transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .heart-bounce:active {
            transform: scale(0.85);
        }.folder-tab {
            clip-path: polygon(0 0, 85% 0, 100% 100%, 0% 100%);
            border-radius: 16px 16px 0 0;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-sand font-display text-deep-blue min-h-screen antialiased selection:bg-terracotta/20">
<div class="mx-auto max-w-md min-h-screen flex flex-col relative overflow-hidden bg-sand">
<div class="h-12 w-full flex items-end justify-between px-6 pb-2 z-20 text-deep-blue">
<span class="text-xs font-bold">9:41</span>
<div class="flex gap-1.5 items-center">
<span class="material-icons text-[16px]">signal_cellular_alt</span>
<span class="material-icons text-[16px]">wifi</span>
<span class="material-icons text-[16px]">battery_full</span>
</div>
</div>
<header class="px-5 pt-2 z-10 sticky top-0 bg-sand">
<div class="flex items-center justify-between mb-6">
<div class="flex items-baseline gap-2">
<h1 class="text-3xl font-hand text-terracotta transform -rotate-1">Favorite</h1>
<p class="text-sm text-deep-blue/60 font-medium">Colecția ta</p>
</div>
<div class="h-10 w-10 rounded-full bg-white shadow-sm border border-stone-100 flex items-center justify-center relative">
<span class="absolute top-2 right-2.5 h-2 w-2 bg-terracotta rounded-full border-2 border-white"></span>
<span class="material-icons text-deep-blue/40 text-xl">notifications</span>
</div>
</div>
<div class="flex items-end pl-1 relative z-10 w-full overflow-x-auto hide-scrollbar -mb-[1px]">
<button class="relative z-10 pt-3 pb-3 px-6 bg-[#E6E4DC] rounded-t-2xl shadow-none text-deep-blue/40 font-bold text-base min-w-[110px] text-center hover:bg-gray-100 transition-colors">
        Universități
    </button>
<button class="relative z-20 pt-3 pb-3 px-6 bg-gray-100 rounded-t-2xl -ml-4 text-deep-blue/40 font-bold text-base min-w-[110px] text-center hover:bg-gray-50 transition-colors">
        Facultăți
    </button>
<button class="relative z-30 pt-3 pb-3 px-6 bg-[#F0EFE9] rounded-t-2xl -ml-4 shadow-none text-deep-blue/40 font-bold text-base min-w-[120px] text-center">
        Programe
    </button>
</div>
<div class="absolute bottom-0 left-0 w-full h-[1px] bg-muted-sand z-20"></div>
</header>
<main class="flex-1 px-5 pt-10 pb-32 overflow-y-auto hide-scrollbar bg-sand flex flex-col items-center justify-center text-center">
<div class="w-full max-w-[280px] aspect-square relative mb-8">
<div class="absolute inset-0 bg-white/40 rounded-full blur-3xl scale-90"></div>
<div class="relative bg-white/60 p-8 rounded-3xl border border-white/50 shadow-soft backdrop-blur-sm transform rotate-2">
<div class="flex flex-col items-center justify-center gap-4 py-4">
<span class="material-symbols-outlined text-terracotta/40 text-[80px]">backpack</span>
<div class="absolute -bottom-2 -right-2 bg-white rounded-full p-2 shadow-md rotate-12">
<span class="material-symbols-outlined text-terracotta text-3xl">search</span>
</div>
<div class="absolute -top-3 -left-3 bg-cream rounded-xl p-2 shadow-sm -rotate-6 border border-stone-100">
<span class="material-symbols-outlined text-olive text-2xl">menu_book</span>
</div>
</div>
</div>
</div>
<h2 class="text-2xl font-bold text-deep-blue mb-3">Colecția ta este goală</h2>
<p class="text-deep-blue/60 leading-relaxed max-w-[300px] text-sm">
        Începe să explorezi universitățile și facultățile din România și salvează-le pe cele care îți plac apăsând pe inimioară.
    </p>
<button class="mt-8 bg-terracotta text-white font-bold py-4 px-10 rounded-2xl shadow-sticker hover:shadow-lg hover:-translate-y-1 transition-all duration-300 flex items-center gap-2">
<span>Explorează acum</span>
<span class="material-icons text-lg">arrow_forward</span>
</button>
</main>
<nav class="absolute bottom-0 w-full h-24 bg-white/90 backdrop-blur-xl border-t border-stone-100 flex items-start justify-around px-2 pt-4 z-30 rounded-t-[2rem] shadow-[0_-5px_20px_-5px_rgba(0,0,0,0.05)]">
<button class="flex flex-col items-center gap-1.5 p-2 text-deep-blue/40 hover:text-deep-blue/70 transition-colors group w-1/2">
<span class="material-icons text-2xl group-hover:-translate-y-1 transition-transform">explore</span>
<span class="text-[11px] font-bold tracking-tight">Explorează</span>
<span class="w-1 h-1 rounded-full bg-transparent mt-1 group-hover:bg-deep-blue/20"></span>
</button>
<button class="flex flex-col items-center gap-1.5 p-2 text-deep-blue group w-1/2">
<span class="material-icons text-2xl group-hover:-translate-y-1 transition-transform text-terracotta">favorite</span>
<span class="text-[11px] font-bold tracking-tight">Favorite</span>
<span class="w-1 h-1 rounded-full bg-terracotta mt-1"></span>
</button>
</nav>
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-deep-blue/10 rounded-full z-40"></div>
</div>
</body></html>
